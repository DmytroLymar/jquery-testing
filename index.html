<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>jquery</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="jquery.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="buttons">
                <h1 class="title">Jquery test</h1>
                <div class="row">
                    <button class="panel-button" data-panelid="panel1">#btn1</button>
                    <button class="panel-button" data-panelid="panel2">#btn2</button>
                    <button class="panel-button" data-panelid="panel3">#btn3</button>
                    <button class="panel-button" data-panelid="panel4">#btn4</button>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-3">
                    <div id="panel1" class="panel panel-primary">
                        <div class="panel-heading">#panel1</div>
                        <div class="panel-body">content</div>
                    </div>
                </div>
                <div class="col-xs-3">
                    <div id="panel2" class="panel panel-primary">
                        <div class="panel-heading">#panel2</div>
                        <div class="panel-body">content</div>
                    </div>
                </div>
                <div class="col-xs-3">
                    <div id="panel3" class="panel panel-primary">
                        <div class="panel-heading">#panel3</div>
                        <div class="panel-body">content</div>
                    </div>
                </div>
                <div class="col-xs-3">
                    <div id="panel4" class="panel panel-primary">
                        <div class="panel-heading">#panel4</div>
                        <div class="panel-body">content</div>
                    </div>
                </div>
            </div>
            <ul class="list">
                <li>one</li>
                <li class="special">two</li>
                <li>three</li>
                <li>
                    <ul class="sublist">
                        <li>1</li>
                        <li>2</li>
                        <li>3</li>
                    </ul>
                </li>
            </ul>
        </div>
    </body>
    <script>
        $(function () {
            var content = 'New content';
            $('.panel-button').on('click', function () {
                var panelId = $(this).attr('data-panelid');
                $('#' + panelId).fadeToggle(1000);
                $('#' + panelId + ' .panel-body').html(content);
            });

            $('li').on('click', function () {
                if ($(this).is('.special')) {
                    alert('special');
                } else {
                    alert('not special');
                }
                $(this).removeClass('special');
                $(this).siblings().addClass('special');
            });
        });
    </script>
</html>
